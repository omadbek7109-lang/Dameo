<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1020" />
    <title>DAMEO — Every Move Matters.</title>
    <meta name="description" content="DAMEO — online shashka (checkers) platformasi. Every Move Matters." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/app.css" />
    <script>
      // Apply the saved theme + language before first paint (no flash).
      (function () {
        try {
          var t = localStorage.getItem('dameo.theme');
          if (t !== 'light' && t !== 'dark') t = document.documentElement.getAttribute('data-theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);
          var l = localStorage.getItem('dameo.lang');
          document.documentElement.lang = l === 'en' ? 'en' : 'uz';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>DAMEO requires JavaScript.</noscript>
    <script type="module" src="/assets/main.js"></script>
  </body>
</html>
