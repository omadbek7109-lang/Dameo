<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1020" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <title>DAMEO — Texnik ishlar</title>
    <!-- TEMPORARY maintenance page. The real app's index.html is in git history (commit ec93a9d); the next app build restores it. -->
    <script>
      (function () {
        var tg = /tgWebApp/.test(location.hash) || /Telegram/i.test(navigator.userAgent);
        if (!tg) return;
        var s = document.createElement('script');
        s.src = 'https://telegram.org/js/telegram-web-app.js';
        s.onload = function () {
          try {
            var w = window.Telegram.WebApp;
            w.ready();
            w.expand();
            w.setHeaderColor && w.setHeaderColor('#0a1020');
            w.setBackgroundColor && w.setBackgroundColor('#0a1020');
          } catch (e) {}
        };
        document.head.appendChild(s);
      })();
    </script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #eef2ff;
        background:
          radial-gradient(90% 60% at 50% 0%, rgba(80, 120, 255, 0.22), transparent 70%),
          #0a1020;
      }
      .box {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        border-radius: 28px;
        text-align: center;
        background: linear-gradient(160deg, rgba(120, 150, 255, 0.12), rgba(40, 60, 140, 0.06));
        border: 1px solid rgba(143, 179, 255, 0.28);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }
      .logo { font-weight: 800; letter-spacing: 0.12em; font-size: 1.1rem; color: #8fb3ff; }
      .ico {
        width: 84px;
        height: 84px;
        margin: 20px auto 14px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(145deg, #3b6cff, #1e3a9a);
        box-shadow: 0 0 30px rgba(59, 108, 255, 0.5);
      }
      .ico svg { width: 40px; height: 40px; animation: spin 6s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .ico svg { animation: none; } }
      h1 { margin: 0 0 10px; font-size: 1.5rem; }
      p { margin: 0 0 8px; line-height: 1.5; color: #c3cdf0; }
      .en { margin-top: 14px; font-size: 0.85rem; color: #8d98bf; }
      a.btn {
        display: inline-block;
        margin-top: 18px;
        padding: 13px 22px;
        border-radius: 999px;
        font-weight: 700;
        color: #fff;
        text-decoration: none;
        background: linear-gradient(180deg, #4d7cff, #2f5be0);
        box-shadow: 0 8px 22px rgba(47, 91, 224, 0.45);
      }
    </style>
  </head>
  <body>
    <main class="box">
