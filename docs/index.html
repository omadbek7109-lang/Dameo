<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08061a" />
    <title>DAMEO — Every Move Matters.</title>
    <meta name="description" content="DAMEO — online shashka (checkers) platformasi. Every Move Matters." />
    <script>
      (function () {
        var tg = /tgWebApp/.test(location.hash) || /Telegram/i.test(navigator.userAgent);
        try { tg = tg || !!sessionStorage.getItem('__telegram__initParams'); } catch (e) {}
        if (tg) document.write('<script src="https://telegram.org/js/telegram-web-app.js?59"><\/script>');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>body{margin:0;background:#0a1020}html[data-theme="light"] body{background:#f2f5fb}</style>
    <link rel="stylesheet" href="style.css?v=3ce35c6dbd" />
    <script>
      // Apply the saved theme + language before first paint (no flash).
      (function () {
        try {
          var t = localStorage.getItem('dameo.theme');
          if (t !== 'light' && t !== 'dark') t = document.documentElement.getAttribute('data-theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);
          var l = localStorage.getItem('dameo.lang');
          document.documentElement.lang = l === 'en' ? 'en' : 'uz';
        } catch (e) {}
      })();
    </script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #eef2ff;
        background:
          radial-gradient(90% 60% at 50% 0%, rgba(80, 120, 255, 0.22), transparent 70%),
          #0a1020;
      }
      .box {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        border-radius: 28px;
        text-align: center;
        background: linear-gradient(160deg, rgba(120, 150, 255, 0.12), rgba(40, 60, 140, 0.06));
        border: 1px solid rgba(143, 179, 255, 0.28);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }
      .logo { font-weight: 800; letter-spacing: 0.12em; font-size: 1.1rem; color: #8fb3ff; }
      .ico {
        width: 84px;
        height: 84px;
        margin: 20px auto 14px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(145deg, #3b6cff, #1e3a9a);
        box-shadow: 0 0 30px rgba(59, 108, 255, 0.5);
      }
      .ico svg { width: 40px; height: 40px; animation: spin 6s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .ico svg { animation: none; } }
      h1 { margin: 0 0 10px; font-size: 1.5rem; }
      p { margin: 0 0 8px; line-height: 1.5; color: #c3cdf0; }
      .en { margin-top: 14px; font-size: 0.85rem; color: #8d98bf; }
      a.btn {
        display: inline-block;
        margin-top: 18px;
        padding: 13px 22px;
        border-radius: 999px;
        font-weight: 700;
        color: #fff;
        text-decoration: none;
        background: linear-gradient(180deg, #4d7cff, #2f5be0);
        box-shadow: 0 8px 22px rgba(47, 91, 224, 0.45);
      }
    </style>
  </head>
  <body>
    <main class="box">
      <div class="logo">DAMEO</div>
      <div class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68 1.65 1.65 0 0 0 10 3.17V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </div>
    </div>
    <script>
      (function () {
        function show(msg) {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0 && !window.__dameoCrashed) return;
          var box = document.getElementById('boot-error');
          document.getElementById('boot-error-text').textContent = msg;
          box.style.display = 'grid';
        }
        window.__dameoBootError = show;
        window.addEventListener('error', function (e) {
          if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
            var src = e.target.src || e.target.href || '';
            if (src.indexOf(location.origin) === 0) show('Fayl topilmadi: ' + src); // ignore third-party (fonts, Telegram SDK)
          }
          else show(String(e.message || e.error));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { if (!document.getElementById('root').childElementCount) show(String(e.reason)); });
        setTimeout(function () { if (!document.getElementById('root').childElementCount) show('Ilova 15 soniyada ishga tushmadi. Internetni tekshiring.'); }, 15000);
      })();
    </script>
    <noscript>DAMEO requires JavaScript.</noscript>
    <script>window.DAMEO_WORKER_URL = new URL("bot-worker.js?v=5db84df5ce", location.href).href;</script>
    <script type="module" src="app.js?v=ac15483bff"></script>
  </body>
</html>
