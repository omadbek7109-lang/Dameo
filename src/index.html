<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1020" />
    <title>DAMEO — Every Move Matters.</title>
    <meta name="description" content="DAMEO — online shashka (checkers) platformasi. Every Move Matters." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>body{margin:0;background:#0a1020}html[data-theme="light"] body{background:#f2f5fb}</style>
    <link rel="stylesheet" href="/assets/app.css" />
    <script>
      // Apply the saved theme + language before first paint (no flash).
      (function () {
        try {
          var t = localStorage.getItem('dameo.theme');
          if (t !== 'light' && t !== 'dark') t = document.documentElement.getAttribute('data-theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);
          var l = localStorage.getItem('dameo.lang');
          document.documentElement.lang = l === 'en' ? 'en' : 'uz';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-error" style="position:fixed;inset:0;display:none;place-items:center;padding:24px;background:#0a1020;color:#e7ecf9;font:15px/1.5 system-ui,sans-serif;text-align:center">
      <div>
        <p style="font-weight:700;font-size:18px;margin:0 0 8px">DAMEO yuklanmadi / failed to load</p>
        <p id="boot-error-text" style="opacity:.75;word-break:break-word;margin:0 0 16px"></p>
        <button onclick="location.reload()" style="padding:10px 18px;border-radius:10px;border:0;background:#4d8dff;color:#06122e;font-weight:700">Qayta yuklash</button>
      </div>
    </div>
    <script>
      (function () {
        function show(msg) {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0 && !window.__dameoCrashed) return;
          var box = document.getElementById('boot-error');
          document.getElementById('boot-error-text').textContent = msg;
          box.style.display = 'grid';
        }
        window.__dameoBootError = show;
        window.addEventListener('error', function (e) {
          if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) show('Fayl topilmadi: ' + (e.target.src || e.target.href));
          else show(String(e.message || e.error));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { if (!document.getElementById('root').childElementCount) show(String(e.reason)); });
        setTimeout(function () { if (!document.getElementById('root').childElementCount) show('Ilova 15 soniyada ishga tushmadi. Internetni tekshiring.'); }, 15000);
      })();
    </script>
    <noscript>DAMEO requires JavaScript.</noscript>
    <script type="module" src="/assets/main.js"></script>
  </body>
</html>
